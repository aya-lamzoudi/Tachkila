        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Tachkila</title>
</head>

<body class="mt-2 ml-4 mr-4">

    <!-- start header -->
    <header>
        <div
            class="headercontainer flex justify-between items-center px-5 h-[50px] bg-[#1E293B] border-b border-solid border-gray-500">
            <div class=" logo flex gap-2">
                <img src="img/logo.jpg" alt="logo" class="w-[30px] h-[30px] rounded-4xl">
                <p class="text-gray-50 font-bold ">TACHKILA</p>
            </div>
            <div class="position">
                <ul class="flex gap-2 ">
                    <li class="text-xs text-orange-400">GB</li>
                    <li class="text-xs text-blue-600">DEF</li>
                    <li class="text-xs text-green-700">MIL</li>
                    <li class="text-xs text-red-600">ATT</li>
                </ul>
            </div>
            <div class="schema flex gap-3">
                <p class="text-ms text-mist-400 ">schéma</p>
                <div class="px-1 border rounded-[10px] border-mist-700 bg-[#1E293B] text-gray-50">4-3-2</div>
            </div>
        </div>

    </header>
    <!-- end header -->
    <!-- start main section -->
    <main>
        <div class="maincontainer  flex bg-[#0F172A]">
            <!-- start aside section -->
            <aside class="sidebar ">
                <div class="sidecontainer bg-[#1E293B] w-[300px] h-full px-2 border-r border-solid border-gray-500">
                    <button
                        class="add-btn bg-green-600 text-gray-50 w-[280px] h-1/15 rounded-[10px] mt-[6px] mb-[10px] font-bold ">+
                        Ajouter un
                        joueur</button>
                    <div class=" flex justify-between text-white text-xs">
                        <h3 class="font-bold">Effectif</h3>
                        <span class="p-[3px] border border-taupe-500 rounded-[10px] bg-[#0F172A]"> 1 joueur(s)</span>
                    </div>
                    <p class="text-xs text-mist-400 pt-[10px] pl-[2px] pb-[3px]">
                        Cliquez sur un joueur placé pour voir sa case sur le
                        terrain. 🖊️ pour modifier, 🗑 pour supprimer.
                    </p>
                    <div id="playerlist ">
                        <div
                            class="player-card px-1 text-gray-50  h-[100px] mt-[10px] mb-[10px] border rounded-[10px] border-l-[4px] border-solid border-orange-400">
                            <div class="player-info flex justify-between p-[6px]">
                                <div class="player flex gap-4">
                                    <div
                                        class="player-number self-center w-[30px] h-[30px] rounded-[30px] border border-solid border-orange-400 text-center ">
                                        1</div>
                                    <div class="player-details">
                                        <div class="player-name font-bold text-white">bono</div>
                                        <div class="player-position text-orange-400">Gardien</div>
                                    </div>
                                </div>

                                <div class="actions">
                                    <button class="edit-btn pr-[4px]"><i class="fa-solid fa-pen"></i></button>
                                    <button class="delete-btn pr-[2px]"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                            <select
                                class="select-position w-[96%] m-auto border rounded-[10px] border-mist-700 bg-[#1E293B]"
                                id="select">
                                <option value="bench selected ">Sur le banc</option>
                                <option value="GB ">GB - Gardien</option>
                                <option value="DG">DG - Défenseur gauche</option>
                                <option value="DC1">DC - Défenseur central 1</option>
                                <option value="DC2">DC - Défenseur central 2</option>
                                <option value="DD">DD - Défenseur droit</option>
                                <option value="MG">MG - Milieu gauche</option>
                                <option value="MC1">MC - Milieu central 1</option>
                                <option value="MC2">MC - Milieu central 2</option>
                                <option value="MD">MD - Milieu droit</option>
                                <option value="BU1">BU - Buteur 1</option>
                                <option value="BU2">BU - Buteur 2</option>
                            </select>
                        </div>
                    </div>
                </div>
